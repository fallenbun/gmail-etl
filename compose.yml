x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__TEST_CONNECTION: Enabled
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONN_RETAIL: postgresql://airflow:${POSTGRES_MASTER_AIRFLOW_PASSWORD}@postgres-master:${POSTGRES_MASTER_PORT}/${POSTGRES_MASTER_DB}
    PYTHONPATH: /opt/airflow/src
    HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
  volumes:  
    - ./src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR}/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
  group_add:
    - "${DOCKER_GID}"
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-50000}"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
services:
  postgres-master:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: postgres-master
    environment:
      - POSTGRES_DB=${POSTGRES_MASTER_DB}
      - POSTGRES_HOST=${POSTGRES_MASTER_HOST}
      - POSTGRES_PORT=${POSTGRES_MASTER_PORT}
      - POSTGRES_USER=${POSTGRES_MASTER_USER}
      - POSTGRES_PASSWORD=${POSTGRES_MASTER_PASSWORD}
      - POSTGRES_INITDB_ARGS=${POSTGRES_MASTER_INITDB_ARGS}
      - AIRFLOW_PASSWORD=${POSTGRES_MASTER_AIRFLOW_PASSWORD}
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d
      - master-pgdata:/var/lib/postgresql/data
    ports:
     - ${POSTGRES_MASTER_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dwh_network

  airflow-postgres:
    image: postgres:17
    container_name: airflow-postgres
    environment:
      - POSTGRES_DB=${AIRFLOW_DB}
      - POSTGRES_PORT=${AIRFLOW_DB_PORT}
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    ports:
     - ${AIRFLOW_DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dwh_network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    networks:
      - dwh_network
  
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - dwh_network

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - dwh_network

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - dwh_network

  python:
    container_name: python
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    #command: sleep infinity # for development
    environment:
      PY_HOST: postgres-master
      PY_PORT: 5432
      PY_DBNAME: ${POSTGRES_MASTER_DB}
      PY_USER: ${POSTGRES_MASTER_USER}
      PY_PASSWORD: ${POSTGRES_MASTER_PASSWORD}
    ports:
      - "8090:8090"
    volumes:
      - ./src:/src
    restart: no
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - dwh_network
  
  dbt:
    container_name: dbt
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    image: dbt-image

networks:
  dwh_network:
    name: dwh_network
    driver: bridge

volumes:
  master-pgdata:
  airflow-pgdata: